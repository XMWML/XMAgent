<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>XMAgent 登录</title>
<style>body{font:16px system-ui;max-width:420px;margin:12vh auto;padding:24px;background:#f5f7fb}main{background:white;padding:28px;border:1px solid #d9dee8;border-radius:8px}label{display:block;margin:12px 0 6px}input,button{width:100%;box-sizing:border-box;padding:10px;border:1px solid #bcc5d4;border-radius:4px}button{margin-top:18px;background:#1f5eff;color:white;border:0;cursor:pointer}.error{color:#a11}</style></head>
<body><main><h1>XMAgent</h1>{% if setup %}<p>首次启动，请设置管理员密码。</p><form method="post" action="/setup"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>密码</label><input type="password" name="password" minlength="10" autocomplete="new-password" required><label>确认密码</label><input type="password" name="password_confirm" minlength="10" autocomplete="new-password" required><button>初始化</button></form>{% else %}<form method="post" action="/login"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>管理员密码</label><input type="password" name="password" autocomplete="current-password" required><button>登录</button></form>{% endif %}{% if error %}<p class="error">{{ error }}</p>{% endif %}</main></body></html>
