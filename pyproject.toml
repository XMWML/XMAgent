[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xmagents"
version = "0.1.0"
description = "Local multi-channel Claude/OpenAI agent gateway"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "aiohttp>=3.10,<4",
  "claude-agent-sdk==0.2.135",
  "croniter>=6,<7",
  "cryptography>=42",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.9,<3",
  "python-multipart>=0.0.12,<1",
  "qrcode[pil]>=8,<9",
  "sse-starlette>=2,<4",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<1"]

[project.scripts]
xmagents = "xmagents.main:main"
xma = "xmagents.main:main"
xma-send-file = "xmagents.main:agent_send_file_main"

[tool.setuptools.packages.find]
include = ["xmagents*"]

[tool.setuptools.package-data]
xmagents = ["web/templates/*.html"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
